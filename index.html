<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Manager</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0d0d0d;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

.box{
    background:#1e1e1e;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:500px;
}

h1{
    margin-bottom:10px;
}

p{
    color:#bbb;
}
</style>
</head>

<body>

<div class="box">
    <h1>QR Manager</h1>
    <p id="status">جاري التحقق من الرابط...</p>
</div>

<script>
async function redirectUser() {

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (!code) {
        document.getElementById("status").innerHTML =
        "أضف الكود بعد الرابط<br><br>?code=001";
        return;
    }

    try {

        const response = await fetch("data.json");
        const data = await response.json();

        if(data[code]){
            window.location.href = data[code];
        }else{
            document.getElementById("status").innerHTML =
            "الكود غير موجود";
        }

    } catch(err){
        document.getElementById("status").innerHTML =
        "خطأ في قراءة البيانات";
    }
}

redirectUser();
</script>

</body>
</html>
